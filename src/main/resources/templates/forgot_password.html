<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Khôi Phục Mật Khẩu Qua Email - VaxFlow</title>
</head>
<body>
    <div layout:fragment="content">

        <section class="py-5" style="min-height: 80vh;">
            <div class="container py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">

                        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                            <div class="text-center mb-4">
                                <div class="vf-brand-badge bg-primary-subtle text-primary mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.8rem; border-radius: 16px;">
                                    <i class="bi bi-envelope-check-fill"></i>
                                </div>
                                <h3 class="fw-bold text-dark mb-1">Khôi Phục Mật Khẩu</h3>
                                <p class="text-muted small">Nhập Email hoặc Tên đăng nhập để nhận mã OTP xác thực</p>
                            </div>

                            <!-- Error alert -->
                            <div class="alert alert-danger small py-2 d-flex align-items-center gap-2 rounded-3" th:if="${errorMessage != null}">
                                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                                <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
                            </div>

                            <!-- Success alert -->
                            <div class="alert alert-success small py-2 d-flex align-items-center gap-2 rounded-3" th:if="${successMessage != null}">
                                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                                <span th:text="${successMessage}">Thao tác thành công!</span>
                            </div>

                            <form th:action="@{/forgot-password}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small text-secondary">Email Hoặc Tên Đăng Nhập</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person-circle"></i></span>
                                        <input type="text" name="emailOrUsername" class="form-control"
                                               placeholder="vd: admin@vaxflow.vn hoặc admin" required autofocus>
                                    </div>
                                    <div class="form-text text-muted" style="font-size: 0.75rem;">
                                        <i class="bi bi-info-circle text-primary me-1"></i>Hệ thống sẽ gửi mã OTP 6 số đến hòm thư đã đăng ký.
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                                    <i class="bi bi-send-fill me-2"></i> Gửi Mã Xác Thực OTP
                                </button>

                                <div class="text-center">
                                    <a th:href="@{/login}" class="text-decoration-none small text-secondary fw-semibold">
                                        <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng Nhập
                                    </a>
                                </div>
                            </form>

                            <div class="mt-4 pt-3 border-top text-center text-muted small">
                                <div><i class="bi bi-shield-check text-success me-1"></i> Cổng Xác Thực An Toàn VaxFlow</div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
