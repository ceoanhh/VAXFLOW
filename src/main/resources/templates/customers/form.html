<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Khách Hàng - VaxFlow' : 'Đăng Ký Khách Hàng Mới - VaxFlow'}">Hồ Sơ Khách Hàng</title>
</head>
<body>
    <div layout:fragment="content">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 small">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/customers}">Khách Hàng</a></li>
                        <li class="breadcrumb-item active" th:text="${isEdit ? 'Chỉnh Sửa' : 'Đăng Ký Mới'}">Đăng Ký</li>
                    </ol>
                </nav>
                <h3 class="fw-bold text-dark mb-0">
                    <i class="bi bi-person-plus-fill text-success me-2"></i>
                    <span th:text="${isEdit ? 'Chỉnh Sửa Hồ Sơ Khách Hàng' : 'Đăng Ký Khách Hàng Tiêm Chủng Mới'}">Đăng Ký Khách Hàng</span>
                </h3>
            </div>
            <div>
                <a th:href="@{/customers}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">
                        <div class="col-md-4">
                            <label for="maKhachHang" class="form-label fw-semibold">Mã Khách Hàng <span class="text-danger">*</span></label>
                            <input type="text" id="maKhachHang" th:field="*{maKhachHang}" class="form-control font-monospace"
                                   placeholder="KH-001" required>
                        </div>

                        <div class="col-md-5">
                            <label for="tenKhachHang" class="form-label fw-semibold">Họ Và Tên <span class="text-danger">*</span></label>
                            <input type="text" id="tenKhachHang" th:field="*{tenKhachHang}" class="form-control"
                                   placeholder="Nguyễn Văn A" required>
                        </div>

                        <div class="col-md-3">
                            <label for="ngaySinh" class="form-label fw-semibold">Ngày Sinh <span class="text-danger">*</span></label>
                            <input type="date" id="ngaySinh" th:field="*{ngaySinh}" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label for="sdt" class="form-label fw-semibold">Số Điện Thoại <span class="text-danger">*</span></label>
                            <input type="text" id="sdt" th:field="*{sdt}" class="form-control"
                                   placeholder="0988776655" required>
                        </div>

                        <div class="col-md-8">
                            <label for="diaChi" class="form-label fw-semibold">Địa Chỉ Thường Trú <span class="text-danger">*</span></label>
                            <input type="text" id="diaChi" th:field="*{diaChi}" class="form-control"
                                   placeholder="Số nhà, đường, quận/huyện, tỉnh/thành..." required>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                            <a th:href="@{/customers}" class="btn btn-outline-secondary px-4">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-success px-4 fw-semibold shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${isEdit ? 'Cập Nhật Hồ Sơ' : 'Lưu Khách Hàng'}">Lưu Thông Tin</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
