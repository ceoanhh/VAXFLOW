<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Đặt Lại Mật Khẩu Mới - VaxFlow</title>
</head>
<body>
    <div layout:fragment="content">

        <section class="py-5" style="min-height: 80vh;">
            <div class="container py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">

                        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                            <div class="text-center mb-4">
                                <div class="vf-brand-badge bg-success-subtle text-success mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.8rem; border-radius: 16px;">
                                    <i class="bi bi-shield-lock-fill"></i>
                                </div>
                                <h3 class="fw-bold text-dark mb-1">Xác Nhận Đặt Lại Mật Khẩu</h3>
                                <p class="text-muted small">Nhập mã OTP nhận được qua email và đặt mật khẩu mới</p>
                            </div>

                            <!-- Error alert -->
                            <div class="alert alert-danger small py-2 d-flex align-items-center gap-2 rounded-3" th:if="${errorMessage != null}">
                                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                                <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
                            </div>

                            <!-- Success alert -->
                            <div class="alert alert-success small py-2 d-flex align-items-center gap-2 rounded-3" th:if="${successMessage != null}">
                                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                                <span th:text="${successMessage}">Thao tác thành công!</span>
                            </div>

                            <form th:action="@{/reset-password}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-secondary">Địa Chỉ Email Khôi Phục</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" name="email" class="form-control bg-light" th:value="${email}" required readonly>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-secondary">Mã Xác Thực OTP (6 Chữ Số) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                                        <input type="text" name="otp" class="form-control font-monospace fs-5 text-center fw-bold text-primary"
                                               placeholder="000000" maxlength="6" required autofocus>
                                    </div>
                                    <div class="form-text text-muted" style="font-size: 0.75rem;">
                                        <i class="bi bi-clock-history text-warning me-1"></i>Mã OTP có hiệu lực trong 15 phút.
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-secondary">Mật Khẩu Mới <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                        <input type="password" name="newPassword" class="form-control"
                                               placeholder="Tối thiểu 6 ký tự..." required minlength="6">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small text-secondary">Xác Nhận Mật Khẩu Mới <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                                        <input type="password" name="confirmPassword" class="form-control"
                                               placeholder="Nhập lại mật khẩu mới..." required minlength="6">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">
                                    <i class="bi bi-check2-circle me-1"></i> Xác Nhận Đặt Lại Mật Khẩu
                                </button>

                                <div class="text-center">
                                    <a th:href="@{/login}" class="text-decoration-none small text-secondary fw-semibold">
                                        <i class="bi bi-arrow-left me-1"></i> Hủy bỏ & Quay lại Đăng Nhập
                                    </a>
                                </div>
                            </form>

                            <div class="mt-4 pt-3 border-top text-center text-muted small">
                                <div><i class="bi bi-shield-check text-success me-1"></i> Chuẩn Bảo Mật An Toàn Y Tế VaxFlow</div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
