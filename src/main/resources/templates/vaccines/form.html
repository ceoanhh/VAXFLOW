<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm Loại Vắc Xin Mới - VaxFlow</title>
</head>
<body>
    <div layout:fragment="content">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 small">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/vaccines}">Kho Vắc Xin</a></li>
                        <li class="breadcrumb-item active">Thêm Mới</li>
                    </ol>
                </nav>
                <h3 class="fw-bold text-dark mb-0">
                    <i class="bi bi-capsule text-danger me-2"></i>Thêm Loại Vắc Xin Vào Danh Mục
                </h3>
            </div>
            <div>
                <a th:href="@{/vaccines}" class="btn btn-outline-secondary btn-sm">Quay lại</a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/vaccines/save}" th:object="${vaccine}" method="post">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label for="maVacXin" class="form-label fw-semibold">Mã Vắc Xin <span class="text-danger">*</span></label>
                            <input type="text" id="maVacXin" th:field="*{maVacXin}" class="form-control font-monospace"
                                   placeholder="VX-001" required>
                        </div>

                        <div class="col-md-5">
                            <label for="tenVacXin" class="form-label fw-semibold">Tên Vắc Xin <span class="text-danger">*</span></label>
                            <input type="text" id="tenVacXin" th:field="*{tenVacXin}" class="form-control"
                                   placeholder="Ví dụ: Hexaxim 6 trong 1" required>
                        </div>

                        <div class="col-md-3">
                            <label for="nhaSanXuat" class="form-label fw-semibold">Nhà Sản Xuất <span class="text-danger">*</span></label>
                            <input type="text" id="nhaSanXuat" th:field="*{nhaSanXuat}" class="form-control"
                                   placeholder="Sanofi Pasteur" required>
                        </div>

                        <div class="col-md-6">
                            <label for="loaiBenhPhong" class="form-label fw-semibold">Bệnh Phòng Ngừa <span class="text-danger">*</span></label>
                            <input type="text" id="loaiBenhPhong" th:field="*{loaiBenhPhong}" class="form-control"
                                   placeholder="Bạch hầu, ho gà, uốn ván, bại liệt..." required>
                        </div>

                        <div class="col-md-3">
                            <label for="soMuiCanTiem" class="form-label fw-semibold">Số Mũi Cần Tiêm <span class="text-danger">*</span></label>
                            <input type="number" id="soMuiCanTiem" th:field="*{soMuiCanTiem}" class="form-control"
                                   min="1" value="1" required>
                        </div>

                        <div class="col-md-3">
                            <label for="donGia" class="form-label fw-semibold">Đơn Giá Tiêm (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" id="donGia" th:field="*{donGia}" class="form-control font-monospace"
                                   placeholder="1000000" min="0" step="10000" required>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                            <a th:href="@{/vaccines}" class="btn btn-outline-secondary px-4">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-danger px-4 fw-semibold shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Lưu Vắc Xin
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
