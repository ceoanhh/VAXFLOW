<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${'Lịch Sử Lương - ' + employee.hoVaTen}">Lịch Sử Lương</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Top Header & Breadcrumb -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 small">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}" class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/employees}" class="text-decoration-none">Nhân Sự</a></li>
                        <li class="breadcrumb-item"><a th:href="@{'/employees/detail/' + ${employee.id}}" class="text-decoration-none" th:text="${employee.hoVaTen}">Tên</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Lịch Sử Lương</li>
                    </ol>
                </nav>
                <h3 class="fw-bold text-dark mb-0">
                    <i class="bi bi-clock-history text-primary me-2"></i>Lịch Sử Bảng Lương
                </h3>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0">
                <a th:href="@{'/employees/detail/' + ${employee.id}}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 shadow-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại hồ sơ
                </a>
                <a th:href="@{'/employees/' + ${employee.id} + '/payrolls/create'}" class="btn btn-success btn-sm d-flex align-items-center gap-1 shadow-sm">
                    <i class="bi bi-plus-lg"></i> Thêm Bảng Lương
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-3 text-dark">Lịch sử thanh toán lương của nhân viên <span class="text-primary" th:text="${employee.hoVaTen}"></span></h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Bảng Lương</th>
                            <th class="text-center">Kỳ lương</th>
                            <th class="text-end">Lương cứng</th>
                            <th class="text-end">Thưởng (+)</th>
                            <th class="text-end">Khấu trừ (-)</th>
                            <th class="text-end">Tổng thực nhận</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payroll : ${payrolls}">
                            <td class="text-muted font-monospace" th:text="${payroll.maBangLuong}"></td>
                            <td class="fw-bold text-center" th:text="${payroll.thang + '/' + payroll.nam}"></td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(payroll.luongCung, 0, 'COMMA', 0, 'POINT')}"></td>
                            
                            <td class="text-end">
                                <strong class="text-success" th:text="${#numbers.formatDecimal(payroll.thuong, 0, 'COMMA', 0, 'POINT')}"></strong>
                                <div class="small text-muted mt-1" th:if="${payroll.lyDoThuong != null and !payroll.lyDoThuong.isEmpty()}" th:text="${payroll.lyDoThuong}"></div>
                            </td>
                            
                            <td class="text-end">
                                <strong class="text-danger" th:text="${#numbers.formatDecimal(payroll.khauTru, 0, 'COMMA', 0, 'POINT')}"></strong>
                                <div class="small text-muted mt-1" th:if="${payroll.lyDoKhauTru != null and !payroll.lyDoKhauTru.isEmpty()}" th:text="${payroll.lyDoKhauTru}"></div>
                            </td>
                            
                            <td class="fw-bold text-primary text-end fs-6" th:text="${#numbers.formatDecimal(payroll.thucNhan, 0, 'COMMA', 0, 'POINT')}"></td>

                            <td class="text-center">
                                <form th:action="@{/employees/{empId}/payrolls/delete/{payrollId}(empId=${employee.id}, payrollId=${payroll.id})}" 
                                    method="post" 
                                    style="display: inline-block;">
                                    <button type="submit" 
                                            class="btn btn-sm btn-outline-danger" 
                                            onclick="return confirm('Bạn có chắc chắn muốn xóa bảng lương này? Hành động này không thể hoàn tác!');">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payrolls)}">
                            <td colspan="7" class="text-center text-muted py-4">Chưa có lịch sử bảng lương nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
