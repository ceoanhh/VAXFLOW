spring.application.name=VAXFLOW
spring.profiles.active=dev

# ===============================
# DATABASE (H2 in-memory for dev/UI preview, compatible with MySQL)
# ===============================
spring.datasource.url=jdbc:h2:mem:vaxflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Neu su dung MySQL cuc bo, mo comment cac dong ben duoi:
# spring.datasource.url=jdbc:mysql://localhost:3306/vaxflow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=2222

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================

server.port=8080