spring.application.name=VAXFLOW
spring.profiles.active=dev

# ===============================
# DATABASE (Luu tru file ben vung vao ./data/vaxflow, khong bi mat du lieu khi tat server)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/vaxflow;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Neu ket noi MySQL thuc te tren may, mo comment cac dong duoi:
# spring.datasource.url=jdbc:mysql://localhost:3306/vaxflow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=2222

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SERVER & SESSION
# ===============================
server.port=8080
server.servlet.session.timeout=15m