spring.application.name=VAXFLOW
spring.profiles.active=dev

# ===============================
# DATABASE (Luu tru file ben vung vao ./data/vaxflow, khong bi mat du lieu khi tat server)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/vaxflow;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tuy chon chay in-memory (khong luu file):
# spring.datasource.url=jdbc:h2:mem:vaxflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

logging.level.org.springframework.boot.web.servlet.context=TRACE
logging.level.org.springframework.boot.autoconfigure.h2=DEBUG

# Neu ket noi MySQL thuc te tren may, mo comment cac dong duoi:
# spring.datasource.url=jdbc:mysql://localhost:3306/vaxflow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=2222

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================
server.port=8080